<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#376a57">
  <meta name="description" content="简单、安心的每日用药提醒">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>按时吃药 · 0.3</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">MEDICINE REMINDER · V0.3</p>
        <h1>好好爱自己，痛苦会过去。</h1>
        <p class="subtitle">把需要记住的时间交给这里，把今天留给自己。</p>
      </div>
      <div class="clock" aria-live="polite">
        <strong id="current-time">--:--</strong>
        <span id="current-date">正在读取日期</span>
      </div>
    </header>

    <section class="card form-card" aria-labelledby="form-title">
      <div class="section-heading">
        <div><p class="step">新提醒</p><h2 id="form-title">添加服药计划</h2></div>
        <div class="heading-actions">
          <button id="install-button" class="install-button" type="button" hidden>安装到手机</button>
          <button id="notification-button" class="text-button" type="button">开启系统通知</button>
        </div>
      </div>

      <form id="reminder-form">
        <label>药品名称<input name="medicine" type="text" maxlength="40" placeholder="例如：维生素 C" required></label>
        <label>备注（可选）<input name="note" type="text" maxlength="60" placeholder="例如：饭后 1 粒"></label>
        <fieldset class="wide-field time-fieldset">
          <legend>提醒时间</legend>
          <div id="time-fields" class="time-fields"><input name="times" type="time" required></div>
          <button id="add-time-button" class="small-button" type="button">＋ 添加时间</button>
        </fieldset>
        <fieldset class="wide-field day-fieldset">
          <legend>重复日期</legend>
          <div class="day-options">
            <label><input type="checkbox" name="days" value="1" checked><span>一</span></label>
            <label><input type="checkbox" name="days" value="2" checked><span>二</span></label>
            <label><input type="checkbox" name="days" value="3" checked><span>三</span></label>
            <label><input type="checkbox" name="days" value="4" checked><span>四</span></label>
            <label><input type="checkbox" name="days" value="5" checked><span>五</span></label>
            <label><input type="checkbox" name="days" value="6" checked><span>六</span></label>
            <label><input type="checkbox" name="days" value="0" checked><span>日</span></label>
          </div>
        </fieldset>
        <button class="primary-button" type="submit">添加提醒</button>
      </form>
      <div class="form-feedback">
        <p id="form-message" class="form-message" aria-live="polite"></p>
        <button id="test-button" class="test-button" type="button">测试弹窗</button>
      </div>
    </section>

    <section class="reminders-section" aria-labelledby="reminders-title">
      <div class="section-heading">
        <div><p class="step">今日计划</p><h2 id="reminders-title">服药提醒</h2></div>
        <span id="reminder-count" class="count-pill">0 项</span>
      </div>
      <div id="reminder-list" class="reminder-list"></div>
      <div id="empty-state" class="empty-state">
        <div class="empty-icon">✓</div><h3>还没有提醒</h3><p>在上方添加第一条服药计划吧。</p>
      </div>
    </section>

    <section class="two-column-section">
      <section class="card compact-card" aria-labelledby="privacy-title">
        <div class="section-heading"><div><p class="step">隐私与权限</p><h2 id="privacy-title">通知设置</h2></div></div>
        <label>锁屏通知内容
          <select id="privacy-mode">
            <option value="private">隐私模式：不显示药名</option>
            <option value="detailed">详细模式：显示药名与备注</option>
          </select>
        </label>
        <div class="permission-row"><span>通知权限</span><strong id="permission-status">检查中</strong></div>
        <p class="privacy-note">所有药品和服用记录只保存在当前设备，不会上传服务器。</p>
        <button id="clear-data-button" class="danger-button" type="button">清除全部本地数据</button>
      </section>

      <section class="card compact-card" aria-labelledby="history-title">
        <div class="section-heading"><div><p class="step">最近记录</p><h2 id="history-title">服药历史</h2></div></div>
        <div id="history-list" class="history-list"></div>
        <p id="history-empty" class="muted-copy">还没有服药记录。</p>
      </section>
    </section>

    <aside class="install-tip"><span>📱</span><div><strong>安装到安卓桌面</strong><p>在 Chrome 菜单中选择“安装应用”或“添加到主屏幕”。</p></div></aside>
    <footer>数据只保存在当前设备中 · 请勿用本应用替代医生建议</footer>
  </main>

  <dialog id="reminder-dialog">
    <div class="dialog-content">
      <div class="dialog-icon">💊</div><p class="step">到时间了</p>
      <h2 id="dialog-title">该吃药啦</h2><p id="dialog-note"></p>
      <div class="dialog-actions">
        <button id="taken-button" class="primary-button" type="button">我已服用</button>
        <button id="later-button" class="secondary-button" type="button">5 分钟后提醒</button>
      </div>
    </div>
  </dialog>

  <template id="reminder-template">
    <article class="reminder-item">
      <div class="time-badge"></div>
      <div class="reminder-copy"><h3></h3><p></p><small class="schedule-copy"></small></div>
      <label class="toggle"><input type="checkbox"><span></span><em>启用</em></label>
      <button class="delete-button" type="button" aria-label="删除提醒">删除</button>
    </article>
  </template>
  <script src="app.js"></script>
</body>
</html>
