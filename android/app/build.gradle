plugins { id "com.android.application" }

android {
    namespace "cloud.suky.medicinereminder"
    compileSdk 35

    defaultConfig {
        applicationId "cloud.suky.medicinereminder"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "0.5.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
